<header class="site-header">
  <nav id="navbar" class="navbar navbar-light navbar-expand-lg {% if site.navbar_fixed %}fixed-top{% else %}sticky-top{% endif %}" aria-label="Primary navigation">
    <div class="container-fluid site-header-inner">
      <a class="navbar-brand sail-brand" href="{{ '/' | relative_url }}" aria-label="SAIL Lab home">
        <span class="sail-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="sail-wordmark">SAIL</span>
        <span class="sail-lab-label">LAB</span>
      </a>

      <button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link{% if page.url == '/projects/' %} active{% endif %}" href="{{ '/projects/' | relative_url }}">Research</a></li>
          <li class="nav-item"><a class="nav-link{% if page.url == '/publications/' %} active{% endif %}" href="{{ '/publications/' | relative_url }}">Publications</a></li>
          <li class="nav-item"><a class="nav-link{% if page.url == '/people/' %} active{% endif %}" href="{{ '/people/' | relative_url }}">People</a></li>
          <li class="nav-item"><a class="nav-link{% if page.url contains '/news' or page.url contains '/blog' %} active{% endif %}" href="{{ '/news/' | relative_url }}">News</a></li>
          <li class="nav-item nav-cta"><a class="nav-link" href="mailto:mahdi@hawaii.edu">Contact</a></li>
          {% if site.enable_darkmode %}
          <li class="nav-item toggle-container">
            <button id="light-toggle" title="Change color theme" aria-label="Change color theme">
              <span class="theme-icon theme-icon-dark" aria-hidden="true">◐</span>
              <span class="theme-icon theme-icon-light" aria-hidden="true">◑</span>
            </button>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  {% if site.enable_progressbar %}<progress id="progress" value="0"><span class="progress-bar"></span></progress>{% endif %}
</header>
